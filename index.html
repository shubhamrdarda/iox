#  Purpose    : Entry point and structural foundation for the I/O 2026 interactive
#               countdown experience, defining the rendering target and HUD.
#

<!DOCTYPE html>
<html lang="en">
<!--
    Vibe & Shine: Google I/O 2026 Countdown Interactive Experience.
    A high-performance particle-based breakout clone designed to showcase
    procedural generation and smooth web animations.
-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ site.title }}</title>

    <!-- Primary Meta Tags -->
    <meta name="title" content="{{ site.title }}">
    <meta name="description" content="{{ site.description }}">
    <meta name="author" content="{{ site.author }}">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ site.url }}{{ site.baseurl }}/">
    <meta property="og:title" content="{{ site.title }}">
    <meta property="og:description" content="{{ site.description }}">
    <meta property="og:image" content="{{ site.url }}{{ site.baseurl }}/{{ site.logo }}">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="{{ site.url }}{{ site.baseurl }}/">
    <meta property="twitter:title" content="{{ site.title }}">
    <meta property="twitter:description" content="{{ site.description }}">
    <meta property="twitter:image" content="{{ site.url }}{{ site.baseurl }}/{{ site.logo }}">

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="{{ site.baseurl }}/{{ site.logo }}">
    <link rel="shortcut icon" type="image/png" href="{{ site.baseurl }}/{{ site.logo }}">
    <link rel="apple-touch-icon" href="{{ site.baseurl }}/{{ site.logo }}">
    <!-- Global site tag (gtag.js) - Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-BP4RDLKBFQ"></script>
    <link rel="stylesheet" href="{{ site.baseurl }}/{{ site.css }}">
</head>

<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
if (window.location.hostname !== "localhost" && window.location.hostname !== "127.0.0.1" && window.location.protocol !== "file:") {
    gtag('config', 'G-BP4RDLKBFQ', {
        ignore_referrer: 'true'
    });
}
</script>

<body>
    <!-- Main rendering target for the high-performance particle engine -->
    <canvas id="flowCanvas"></canvas>

    <!-- HUD: Overlays real-time game metrics and status messages -->
    <div id="hud">
        <div class="stat-card" id="status-card">
            <span class="label">Status</span>
            <span id="ui-text" class="value">Ignite the Countdown</span>
        </div>
        <div class="stat-card">
            <span class="label">Score</span>
            <span id="score-val" class="value">0</span>
        </div>
        <div class="stat-card">
            <span class="label">Time</span>
            <span id="chances-val" class="value">00:00</span>
        </div>
    </div>

    <!-- Background Layer: Thematic typography displayed behind the gameplay -->
    <div id="hero-brand">Google I/O 2026</div>

    <!-- End-Game UI: Post-victory credits and repository links -->
    <div id="final-credits">
        <div class="stat-card" id="credit-card">
            <span class="label">Developer</span>
            <span class="value"><a href="https://godarda.in/shubhamrdarda/" target="_blank">Shubham Darda</a></span>
        </div>
        <div class="stat-card" id="repo-card">
            <span class="label">Source Code</span>
            <span class="value"><a href="https://github.com/shubhamrdarda/iox" target="_blank">GitHub</a></span>
        </div>
    </div>

    <!-- Footer: Minimalist branding and attribution -->
    <div id="footer-hint">
        I/O 2026 <span class="dot">•</span> Experience Powered By Gemini
    </div>
    <script src="{{ site.baseurl }}/{{ site.js }}"></script>
</body>
</html>
