<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | {{ site.title }}</title>
    <link rel="icon" type="image/png" href="{{ site.baseurl }}/{{ site.logo }}">
    <link rel="shortcut icon" type="image/png" href="{{ site.baseurl }}/{{ site.logo }}">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: radial-gradient(circle at center, #0a0a1a 0%, #050505 100%);
            font-family: 'Google Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            text-align: center;
            user-select: none;
        }
        .container {
            padding: 40px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 90%;
            box-sizing: border-box;
        }
        h1 {
            font-size: clamp(60px, 15vw, 100px);
            margin: 0;
            background: linear-gradient(90deg, #4285F4, #9B72CB, #D96570, #13B5C7);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
        }
        p {
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.6;
            margin: 20px 0 30px;
        }
        .btn {
            display: inline-block;
            padding: 12px 32px;
            background: #4285F4;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 700;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(66, 133, 244, 0.3);
        }
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(66, 133, 244, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <p>This path seems to have vanished into the digital void. Let's get you back to the countdown.</p>
        <a href="{{ site.baseurl }}/" class="btn">Return to I/O 2026</a>
    </div>
</body>
</html>
